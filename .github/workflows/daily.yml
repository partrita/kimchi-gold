name: Daily Collect and Deploy

on:
  schedule:
    - cron: '0 3 * * *' # 12:00 KST
  workflow_dispatch:
  push:
    branches: [main]
    paths: [website/**]

permissions:
  contents: write
  pages: write
  id-token: write
  issues: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  collect-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libjpeg-dev zlib1g-dev

      - name: Install project
        run: uv sync --locked --all-extras --dev

      - name: Restore historical data from data-store
        run: |
          git fetch origin data-store --depth=1 || true
          if git show-ref --verify --quiet refs/remotes/origin/data-store; then
            echo "Restoring data from data-store branch..."
            git checkout origin/data-store -- data/kimchi_gold_price_log.csv || true
            # data-store may contain PNG, restore it too if exists
            git checkout origin/data-store -- data/kimchi_gold_price_recent_12months.png 2>/dev/null || true
          else
            echo "No data-store branch found, start fresh"
            mkdir -p data
          fi
          ls -lh data/ || true
          wc -l data/kimchi_gold_price_log.csv || echo "no csv yet"

      - name: Run data collector
        run: uv run python scripts/collect_data.py

      - name: Run chart generator
        run: uv run python scripts/generate_chart.py || true

      - name: Run outlier analyzer
        id: outlier
        run: |
          output=$(uv run python scripts/analyze_outlier.py)
          EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
          echo "full_output<<$EOF" >> $GITHUB_OUTPUT
          echo "$output" >> $GITHUB_OUTPUT
          echo "$EOF" >> $GITHUB_OUTPUT
          result=$(echo "$output" | head -1)
          echo "result=$result" >> $GITHUB_OUTPUT
          echo "Result: $result"

      - name: Create issue on outlier
        if: steps.outlier.outputs.result == 'True'
        uses: actions/github-script@v9
        env:
          FULL_OUTPUT: ${{ steps.outlier.outputs.full_output }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fullOutput = process.env.FULL_OUTPUT || "";
            const lines = fullOutput.split('\n').filter(l => l.trim() !== '');
            const body = `김치 프리미엄이 통계적 이상치로 감지되었습니다.\n\n${lines.slice(1).join('\n')}\n\n자세한 분석 결과는 Actions 로그를 확인해주세요.`;
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '김치 프리미엄 이상치 감지 알림',
              body
            });

      - name: Publish data to data-store branch
        run: |
          git config user.name "Auto_Scraping"
          git config user.email "deepthough@postech.ac.kr"
          # Save current data snapshot to temp (contains full history + today's row)
          mkdir -p /tmp/snapshot
          cp data/kimchi_gold_price_log.csv /tmp/snapshot/kimchi_gold_price_log.csv || true
          cp data/kimchi_gold_price_recent_12months.png /tmp/snapshot/ 2>/dev/null || true
          wc -l /tmp/snapshot/kimchi_gold_price_log.csv || true

          git fetch origin data-store --depth=1 || true
          if git show-ref --verify --quiet refs/remotes/origin/data-store; then
            git checkout data-store
            # Keep workflow file in sync to avoid divergence
            git checkout main -- .github/workflows/daily.yml 2>/dev/null || true
          else
            git checkout --orphan data-store
            git rm -rf --cached . > /dev/null || true
          fi

          mkdir -p data
          cp /tmp/snapshot/kimchi_gold_price_log.csv data/kimchi_gold_price_log.csv
          cp /tmp/snapshot/kimchi_gold_price_recent_12months.png data/ 2>/dev/null || true

          git add -f data/
          if git diff --cached --quiet; then
            echo "No data changes to publish"
          else
            git commit -m "data: $(date -u +%Y-%m-%d) snapshot"
            git push origin data-store
          fi

          # Return to main for Pages deploy and restore data for quarto
          git checkout main
          mkdir -p data
          cp /tmp/snapshot/kimchi_gold_price_log.csv data/kimchi_gold_price_log.csv
          cp /tmp/snapshot/kimchi_gold_price_recent_12months.png data/ 2>/dev/null || true
          ls -lh data/
          wc -l data/kimchi_gold_price_log.csv

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Render Quarto website
        uses: quarto-dev/quarto-actions/render@v2
        env:
          QUARTO_PYTHON: .venv/bin/python
        with:
          path: website
          to: html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: website/docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
