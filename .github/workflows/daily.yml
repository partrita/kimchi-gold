name: Daily Collect and Deploy

on:
  schedule:
    - cron: '0 3 * * *' # 12:00 KST
  workflow_dispatch:
  push:
    branches: [main]
    paths: [website/**]

permissions:
  contents: write
  pages: write
  id-token: write
  issues: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  collect-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install project
        run: uv sync --locked --all-extras

      - name: Restore historical data from data-store
        run: |
          mkdir -p data
          if git fetch origin data-store --depth=1; then
            git checkout origin/data-store -- data/ || true
          fi

      - name: Run data collector
        run: uv run python scripts/collect_data.py

      - name: Run chart generator
        run: uv run python scripts/generate_chart.py || true

      - name: Run outlier analyzer
        id: outlier
        run: |
          output=$(uv run python scripts/analyze_outlier.py)
          EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
          echo "full_output<<$EOF" >> $GITHUB_OUTPUT
          echo "$output" >> $GITHUB_OUTPUT
          echo "$EOF" >> $GITHUB_OUTPUT
          result=$(echo "$output" | head -1)
          echo "result=$result" >> $GITHUB_OUTPUT
          echo "Result: $result"

      - name: Create issue on outlier
        if: steps.outlier.outputs.result == 'True'
        uses: actions/github-script@v9
        env:
          FULL_OUTPUT: ${{ steps.outlier.outputs.full_output }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fullOutput = process.env.FULL_OUTPUT || "";
            const lines = fullOutput.split('\n').filter(l => l.trim() !== '');
            const body = `김치 프리미엄이 통계적 이상치로 감지되었습니다.\n\n${lines.slice(1).join('\n')}\n\n자세한 분석 결과는 Actions 로그를 확인해주세요.`;
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '김치 프리미엄 이상치 감지 알림',
              body
            });

      - name: Publish data to data-store branch
        run: |
          git config user.name "Auto_Scraping"
          git config user.email "deepthough@postech.ac.kr"
          if git show-ref --verify --quiet refs/remotes/origin/data-store; then
            git worktree add -B data-store /tmp/data-store origin/data-store
          else
            git worktree add --orphan -b data-store /tmp/data-store
          fi
          mkdir -p /tmp/data-store/data
          cp -r data/. /tmp/data-store/data/
          git -C /tmp/data-store add -f data/
          if ! git -C /tmp/data-store diff --cached --quiet; then
            git -C /tmp/data-store commit -m "data: $(date -u +%Y-%m-%d) snapshot"
            git -C /tmp/data-store push origin data-store
          fi

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Render Quarto website
        uses: quarto-dev/quarto-actions/render@v2
        env:
          QUARTO_PYTHON: .venv/bin/python
        with:
          path: website
          to: html

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: website/docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
