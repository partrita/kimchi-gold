name: Daily Kimchi Gold

on:
  schedule:
    # 매일 정오(한국시간, KST=UTC+9) 실행 (UTC 기준 0 12 * * *)
    - cron: '0 3 * * *'
  workflow_dispatch:  # 수동 실행도 가능하게 함

permissions:
  contents: write
  issues: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        run: uv python install 3.11

      - name: Install Pillow dependencies
        run: sudo apt-get update && sudo apt-get install -y libjpeg-dev zlib1g-dev

      - name: Install the project
        run: uv sync --locked --all-extras --dev

      - name: Create data directory
        run: mkdir -p data/

      - name: Run data collector
        run: uv run python scripts/collect_data.py

      - name: Run data chart generator
        run: uv run python scripts/generate_chart.py

      - name: Run outlier analyzer script and get result
        id: run_python
        run: |
          output=$(uv run python scripts/analyze_outlier.py)
          EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
          echo "full_output<<$EOF" >> $GITHUB_OUTPUT
          echo "$output" >> $GITHUB_OUTPUT
          echo "$EOF" >> $GITHUB_OUTPUT
          # The first line of output is still 'True' or 'False'
          result=$(echo "$output" | head -1)
          echo "result=$result" >> $GITHUB_OUTPUT
          echo "Python script result: $result"
          echo "Full output:"
          echo "$output"

      - name: Check result and create issue
        if: steps.run_python.outputs.result == 'True'
        uses: actions/github-script@v9
        env:
          FULL_OUTPUT: ${{ steps.run_python.outputs.full_output }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fullOutput = process.env.FULL_OUTPUT || "";
            const lines = fullOutput.split('\n').filter(line => line.trim() !== '');
            // The first line is 'True', the second is "김치 프리미엄이 이상치입니다!",
            // then the detailed explanation follows.
            const issueBody = `김치 프리미엄이 통계적 이상치로 감지되었습니다.\n\n${lines.slice(1).join('\n')}\n\n자세한 분석 결과는 Actions 로그를 확인해주세요.`;

            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '김치 프리미엄 이상치 감지 알림',
              body: issueBody
            });

      - name: Publish data snapshot to data-store branch
        run: |
          git config --local user.email "deepthough@postech.ac.kr"
          git config user.name "Auto_Scraping"
          # data-store 브랜치에 누적 히스토리를 유지한다.
          git fetch origin data-store --depth=1 || true
          if git show-ref --verify --quiet refs/remotes/origin/data-store; then
            git checkout data-store
            # data-store 브랜치는 data/만 포함하므로 main 파일과 충돌 방지
            git checkout main -- .github/workflows/Daily_collect.yml 2>/dev/null || true
          else
            git checkout --orphan data-store
            git rm -rf --cached . > /dev/null || true
          fi
          mkdir -p data
          git checkout main -- data/kimchi_gold_price_log.csv 2>/dev/null || true
          # collector가 생성한 최신 data/를 우선 유지 (이미 워크스페이스에 있음)
          git add -f data/
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "data: $(date -u +%Y-%m-%d) snapshot"
            git push origin data-store
          else
            echo "No data to publish. Skipping."
          fi
