name: Publish Website

on:
  push:
    branches:
      - main
    paths:
      - 'website/**'
      - 'data/**'
  workflow_dispatch:
  workflow_run:
    workflows: ["Daily Kimchi Gold"]
    types:
      - completed

permissions:
  contents: write    # needed to push to gh-pages branch

jobs:
  publish:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Fetch latest data from data-store branch
        run: |
          git fetch origin data-store --depth=1
          git checkout origin/data-store -- data
          ls -la data/

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install .[website]

      - name: Render Quarto Project
        uses: quarto-dev/quarto-actions/render@v2
        with:
          path: website
          to: html

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./website/docs
          # 매 배포마다 gh-pages를 단일 커밋으로 교체해 히스토리 누적 방지
          force_orphan: true
